name: Publish demo

# Builds the demo (scripts/build_demo.py -> site/index.html) and pushes it to the
# gh-pages branch, which GitHub Pages serves at https://pandasuwu.github.io/Multi_Agent_RL-FAI-/
on:
  push:
    branches: [main]
    paths: ["scripts/demo_template.html", "scripts/build_demo.py", "results/tables/**", "data/connectome/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pandas pyarrow pyyaml networkx
      - name: Build
        run: python scripts/build_demo.py
      - name: Push site/ to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
