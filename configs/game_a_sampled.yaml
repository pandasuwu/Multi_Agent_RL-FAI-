base: base.yaml
experiment: game_a_sampled
arms:
  - {name: oracle}
  - {name: tabular}
  - {name: dense}
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
# COMPUTE REDUCTION (recorded in RESULTS.md): the full grid must run on a laptop CPU
# in < 2 h. Sampled mode uses the minimum 10 seeds and 3000 episodes (exact modes: 20).
seeds: {start: 0, count: 10}
training:
  mode: sampled
  steps: 3000
  eval_every: 50
metrics:
  # sampled REINFORCE has a noise floor near 0.03 on this game (docs/theory.md, sec. 5);
  # the exact-mode threshold of 0.01 is not reachable, so speed uses 0.05
  threshold: 0.05
# asymmetric win/loss sweep; ratio 1 is the symmetric control and the main
# sampled-mode comparison. Learning rates are tuned at ratio 1 only.
sweep:
  training.loss_win_ratio: [1.0, 2.0, 4.0, 8.0]
lr_from: {file: tuned_lr.yaml, experiment: game_a_sampled}
