# Game C, exact, with the policy read from all 258 neurons through a rank-4 map instead
# of the 5 AVLP727m neurons (the readout that removed most of the circuit-vs-dense gap
# in Game B, RESULTS.md sec. 12). Parameter counts re-matched within 0.5%.
base: gamec_exact.yaml
experiment: gamec_readout_all_exact
network:
  readout: all
  readout_rank: 4
  param_tolerance: 0.01   # dense width steps by whole units: the closest is 6,652 vs 6,594 (0.9%)
arms:
  - {name: dense}
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
lr_from: null
lr: {default: 0.01}
sweep:
  training.shared_lr: [0.003, 0.01, 0.03]
