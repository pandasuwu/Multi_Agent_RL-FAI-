# Game C, sampled: every circuit arm at one shared rate (the modal tuned
# rate of gamec_sampled), readout input as is and RMS-normalised, 20 seeds.
base: gamec_sampled.yaml
experiment: gamec_robust_sampled
arms:
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
lr_from: {file: tuned_lr.yaml, experiment: gamec_sampled, share_circuit_lr: true}
sweep:
  network.readout_norm: [none, ema_rms]
