# Shared learning-rate sweep (TA review, Nov 2026). Every network arm runs at every
# rate of the exact-mode tuning grid, on evaluation seeds rather than tuning seeds, so
# the wiring contrasts can be read at each rate separately from per-arm tuning.
base: game_b_exact.yaml
experiment: lrsweep_game_b_exact
seeds: {start: 0, count: 10}
arms:
  - {name: dense}
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
lr_from: null
lr: {default: 0.01}   # unused: training.shared_lr overrides it for every arm
sweep:
  training.shared_lr: [0.001, 0.003, 0.01, 0.03, 0.1]
