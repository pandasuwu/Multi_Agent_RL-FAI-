# Population-level Nash check (TA review, Nov 2026). Same runs as
# robust_game_a_sampled_shared_lr plus tabular and dense, re-run so that every run also
# records each agent's own distance from the equilibrium (agent_tv_mean / _max) next to
# the individual and population-mixture exploitability. Circuit arms share one rate.
base: robust_game_a_sampled_shared_lr.yaml
experiment: popnash_game_a_sampled
arms:
  - {name: tabular}
  - {name: dense}
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
