# Robustness check: all circuit arms share one learning rate (the modal tuned value),
# so connectome vs rewired vs random differ ONLY in the mask. Symmetric updates.
base: game_a_sampled.yaml
experiment: robust_game_a_sampled_shared_lr
arms:
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
sweep: null   # symmetric updates only (loss_win_ratio = 1)
lr_from: {file: tuned_lr.yaml, experiment: game_a_sampled, share_circuit_lr: true}
