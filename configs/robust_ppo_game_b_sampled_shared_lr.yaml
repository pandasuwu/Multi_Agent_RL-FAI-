# Robustness check for the PPO grid in Game B, same protocol as
# robust_ppo_game_a_sampled_shared_lr.yaml. The FlyGM arms are not here: at 4 h of CPU
# per run they are in their own experiment (ppo_game_b_sampled_flygm) at 3 seeds.
base: ppo_game_b_sampled.yaml
experiment: robust_ppo_game_b_sampled_shared_lr
arms:
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
lr_from: {file: tuned_lr.yaml, experiment: ppo_game_b_sampled, share_circuit_lr: true}
