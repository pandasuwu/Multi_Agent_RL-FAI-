# Activation-scale check (review, Nov 2026). Adam moves the readout weights by about
# lr per step whatever the gradient, so how fast the policy moves depends on the size
# of the readout input. If the real circuit's output neurons are more (or less) active
# than its controls', a "wiring effect" on speed or stability could be only that.
# Every circuit arm runs at two shared rates, with the readout input as is (none) and
# divided by its running RMS (ema_rms). An effect that survives ema_rms is not a
# step-size effect. Readout-input RMS is logged for every run (diag_readout_rms_*).
base: game_a_exact.yaml
experiment: scalenorm_game_a_exact
seeds: {start: 0, count: 20}
training: {eval_every: 5}   # finer than the 25 of game_a_exact, for the speed contrast
arms:
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
lr_from: null
lr: {default: 0.01}   # unused: training.shared_lr overrides it for every arm
sweep:
  training.shared_lr: [0.01, 0.03]
  network.readout_norm: [none, ema_rms]
