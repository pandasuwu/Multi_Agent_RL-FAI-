# Game B, exact: unroll depth 4 and 8 instead of 6 (4 = exactly the core
# PPL1 -> MBON -> X -> Y -> AVLP727m path). Circuit arms at the shared rate 0.01, where
# all of them are stable at depth 6 (sec. 15.4); depth 6 itself is in
# scalenorm_game_b_exact (shared_lr 0.01, readout_norm none), same seeds.
base: game_b_exact.yaml
experiment: unroll_game_b_exact
seeds: {start: 0, count: 20}
arms:
  - {name: connectome}
  - {name: connectome, sign_constrained: true}
  - {name: rewired}
  - {name: rewired, sign_constrained: true}
  - {name: random_sparse}
  - {name: random_sparse, sign_constrained: true}
lr_from: null
lr: {default: 0.01}
sweep:
  training.shared_lr: [0.01]
  network.unroll_steps: [4, 8]
