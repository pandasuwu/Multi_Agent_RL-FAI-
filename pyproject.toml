[project]
name = "woa-connectome"
version = "0.1.0"
description = "Do fly give-up-circuit wiring constraints change equilibrium learning in the war of attrition?"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "networkx>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
