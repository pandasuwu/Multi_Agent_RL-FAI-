game:
  name: A
  prize: 1.0
  cost_rate: 1.0
  t_max: 8.0
  n_bins: 64
  value_rate: 1.0
  n_types: 50
seeds:
  start: 0
  count: 10
network:
  activation: tanh
  unroll_steps: 6
  init_gain: 1.0
  dense_hidden_layers: 2
  dense_width: 47
  param_tolerance: 0.05
training:
  mode: exact
  steps: 3000
  eval_every: 25
  optimizer: adam
  adam_betas:
  - 0.0
  - 0.999
  lr_schedule: cosine
  lr_final_fraction: 0.05
  population_size: 8
  matches_per_step: 128
  baseline_rate: 0.05
  loss_win_ratio: 1.0
metrics:
  threshold: 0.01
  final_window: 0.1
  late_fraction: 0.5
stats:
  n_boot: 10000
  confidence: 0.95
lr:
  dense: 0.003
  tabular: 0.1
tuning:
  seeds:
    start: 1000
    count: 3
  lr_grid:
    exact:
      tabular:
      - 0.03
      - 0.1
      - 0.3
      network:
      - 0.001
      - 0.003
      - 0.01
    sampled:
      tabular:
      - 0.003
      - 0.01
      - 0.03
      network:
      - 0.0003
      - 0.001
      - 0.003
experiment: game_a_exact
arms:
- name: oracle
- name: tabular
- name: dense
lr_from:
  file: tuned_lr.yaml
  experiment: game_a_exact
