  lr_final_fraction: 0.05
  population_size: 8
  matches_per_step: 128
  baseline_rate: 0.05
  loss_win_ratio: 1.0
metrics:
  threshold: 0.01
  final_window: 0.1
  late_fraction: 0.5
stats:
  n_boot: 10000
  confidence: 0.95
lr:
  default: 0.05
  tabular: 0.1
experiment: game_a_exact
arms:
- name: oracle
- name: tabular
