game:
  name: A
  prize: 1.0
  cost_rate: 1.0
  t_max: 8.0
  n_bins: 64
  value_rate: 1.0
  n_types: 50
seeds:
  start: 0
  count: 20
network:
  activation: tanh
  unroll_steps: 6
