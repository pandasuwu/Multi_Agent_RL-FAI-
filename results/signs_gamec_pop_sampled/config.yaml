game:
  name: C
  prize: 1.0
  cost_rate: 1.0
  t_max: 20.0
  n_bins: 64
  value_rate: 1.0
  n_types: 50
  hunger_rate: 1.0
  food_levels:
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  n_hunger: 25
  input_code: population
  n_population: 16
seeds:
  start: 0
  count: 20
network:
  activation: tanh
  unroll_steps: 6
  init_gain: 1.0
  dense_hidden_layers: 2
  dense_width: matched
  param_tolerance: 0.05
  sparse_max_batch: 8
training:
  mode: sampled
  steps: 5000
  eval_every: 50
  optimizer: adam
  adam_betas:
  - 0.0
  - 0.999
  lr_schedule: cosine
  lr_final_fraction: 0.05
  population_size: 8
  matches_per_step: 128
  baseline_rate: 0.05
  loss_win_ratio: 1.0
metrics:
  threshold: 0.05
  final_window: 0.1
  late_fraction: 0.5
stats:
  n_boot: 10000
  confidence: 0.95
lr:
  connectome: 0.003
  connectome+sign: 0.003
  dense: 0.003
  random_sparse: 0.003
  random_sparse+sign: 0.003
  rewired: 0.003
  rewired+sign: 0.003
  tabular: 0.03
  rewired_block: 0.003
  rewired_block+sign: 0.003
  connectome_shortcut: 0.003
  connectome_shortcut+sign: 0.003
  rewired_noshortcut: 0.003
  rewired_noshortcut+sign: 0.003
  connectome_signshuffle: 0.003
  connectome_signshuffle+sign: 0.003
  connectome_signshuffle_signed: 0.003
  connectome_signshuffle_signed+sign: 0.003
  connectome_signshuffle_stage: 0.003
  connectome_signshuffle_stage+sign: 0.003
tuning:
  seeds:
    start: 1000
    count: 3
  lr_grid:
    exact:
      tabular:
      - 0.03
      - 0.1
      - 0.3
      - 1.0
      network:
      - 0.001
      - 0.003
      - 0.01
      - 0.03
      - 0.1
      - 0.3
    sampled:
      tabular:
      - 0.003
      - 0.01
      - 0.03
      - 0.1
      network:
      - 0.0001
      - 0.0003
      - 0.001
      - 0.003
      - 0.01
      - 0.03
connectome:
  dataset: male-cns:v1.0
  base_url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome
  raw_dir: data/raw
  files:
    annotations:
      name: body-annotations-male-cns-v1.0-minconf-0.5.feather
      bytes: 14483314
    neurotransmitters:
      name: body-neurotransmitters-male-cns-v1.0.feather
      bytes: 43282834
    weights:
      name: connectome-weights-male-cns-v1.0-minconf-0.5-traced-only.feather
      bytes: 508025642
  cache: data/connectome/give_up_circuit.npz
  provenance: data/connectome/give_up_circuit.provenance.json
  min_synapses: 5
  core:
    ppl1:
      type_regex: ^PPL1[0-9]+$
    mbon:
      types:
      - MBON18
      - MBON19
    tk:
      types:
      - AVLP727m
  path:
    source: mbon
    target: tk
    max_synapses: 3
  expansion:
    min_exchanged_synapses: 400
    target_range:
    - 100
    - 500
  roles:
    input: ppl1
    output: tk
  sign_map:
    acetylcholine: 1
    gaba: -1
    glutamate: -1
    histamine: -1
  rewire_swaps_per_edge: 10
experiment: signs_gamec_pop_sampled
arms:
- name: connectome
  sign_constrained: true
- name: connectome_signshuffle
  sign_constrained: true
- name: connectome_signshuffle_signed
  sign_constrained: true
- name: connectome_signshuffle_stage
  sign_constrained: true
lr_from:
  file: tuned_lr.yaml
  experiment: gamec_pop_sampled
  share_circuit_lr: true
sweep:
  network.readout_norm:
  - none
  - ema_rms
